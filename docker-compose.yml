services:
  postgres:
    image: postgres:16
    container_name: nutri-postgres
    environment:
      POSTGRES_DB: nutridb
      POSTGRES_USER: nutri
      POSTGRES_PASSWORD: nutri123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutri -d nutridb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: nutri-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nutridb
      SPRING_DATASOURCE_USERNAME: nutri
      SPRING_DATASOURCE_PASSWORD: nutri123
      JWT_SECRET: 3f8a2b1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: